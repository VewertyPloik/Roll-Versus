<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>roll versus</title>
    <style>
        :root {
            --bg-base: #0f0f13;
            --ui-bg: #1a1a20;
            --text-main: #e0e0e0;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
            text-transform: lowercase !important; 
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            height: 100vh;
            touch-action: none;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background-color: var(--bg-base);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }

        /* CHANGED FROM scale(0.9) to scale(0.75) FOR 25% ZOOM OUT */
        #app-container.zoomed {
            transform: scale(0.75);
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-base);
            z-index: 10;
        }

        .hidden { display: none !important; }

        h1 { 
            font-size: 3rem; 
            margin-bottom: 1.5rem; 
            color: var(--text-main); 
            font-weight: 300;
            letter-spacing: 4px;
            text-align: center;
        }

        h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            font-weight: 700;
        }

        .btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid #444;
            padding: 15px 30px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border-radius: 8px;
            margin: 10px;
            width: 240px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn:active, .btn:hover { 
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow) inset, 0 0 15px var(--accent-glow);
            color: var(--accent);
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.9rem;
            width: auto;
            margin-top: 5px;
        }

        .menu-panel {
            background: var(--ui-bg);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
            width: 280px;
            border: 1px solid #333;
            max-height: 50vh;
            display: flex;
            flex-direction: column;
        }

        .menu-panel label {
            font-size: 1.2rem;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 15px;
            color: #aaa;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            margin-bottom: 15px;
        }

        #name-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .name-input-row {
            display: flex; align-items: center; justify-content: space-between;
        }

        .name-indicator {
            width: 12px; height: 12px; border-radius: 50%;
        }

        input[type="text"] {
            background: #111; border: 1px solid #444; color: var(--text-main);
            padding: 8px; border-radius: 4px; width: 180px; text-align: center;
            font-family: inherit; letter-spacing: 1px;
        }
        
        input[type="text"]:focus { outline: none; border-color: var(--accent); }

        /* Zoom Button */
        #zoom-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #1a1a20;
            color: #888;
            border: 1px solid #444;
            padding: 8px 12px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 50;
            transition: all 0.2s ease;
        }

        #zoom-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Update Log */
        #update-log-screen {
            background-color: rgba(15, 15, 19, 0.98);
            backdrop-filter: blur(8px);
            z-index: 60;
        }

        .log-content {
            background: var(--ui-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            width: 80%;
            max-width: 350px;
            text-align: left;
        }

        .log-content p {
            color: #bbb;
            font-size: 1.1rem;
            line-height: 1.6;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .log-content span.date {
            color: var(--accent);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }

        /* Game UI */
        #game-screen {
            display: flex; flex-direction: column; width: 100%; height: 100%; z-index: 5;
        }

        #game-ui {
            width: 100%; background: var(--ui-bg); border-bottom: 1px solid #333;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
        }

        #turn-indicator { font-size: 1.3rem; letter-spacing: 2px; font-weight: 600; }

        #mini-leaderboard {
            text-align: right; font-size: 0.8rem; letter-spacing: 1px; line-height: 1.4;
            cursor: pointer; padding: 5px 10px; border: 1px solid #333;
            border-radius: 6px; background: #111; transition: border-color 0.2s;
        }
        #mini-leaderboard:hover { border-color: var(--accent); }
        #mini-leaderboard span.title { color: #888; font-size: 0.7rem; display: block; margin-bottom: 2px; text-decoration: underline; }

        canvas { flex-grow: 1; width: 100%; display: block; background-color: var(--bg-base); }

        /* Full Leaderboard Modal */
        #full-leaderboard-screen { background-color: rgba(15, 15, 19, 0.95); backdrop-filter: blur(5px); z-index: 15; }
        #full-leaderboard-list { margin: 20px 0; width: 80%; text-align: center; }
        .lb-entry { padding: 10px; margin: 5px 0; background: #1a1a20; border: 1px solid #333; border-radius: 8px; font-size: 1.2rem; letter-spacing: 2px; }

        /* Massive Awards Scroll Screen */
        #game-over-screen {
            display: block; 
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            background-color: var(--bg-base);
            z-index: 20;
            padding: 0;
            scroll-behavior: smooth;
        }

        .award-card {
            scroll-snap-align: start;
            height: 100svh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid #222;
            position: relative;
        }

        .award-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .award-icon {
            width: 55vw;
            height: 55vw;
            max-width: 280px;
            max-height: 280px;
            margin: 30px 0;
        }

        .award-winner {
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .award-desc {
            font-size: 1.4rem;
            color: #ccc;
            line-height: 1.6;
            max-width: 90%;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .scroll-prompt {
            position: absolute;
            bottom: 20px;
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .action-slide {
            scroll-snap-align: start;
            height: 100svh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0a0a0d;
        }

        .watermark {
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            font-size: 0.85rem; 
            color: #ffffff; 
            opacity: 0.2; 
            pointer-events: none; 
            z-index: 50; 
            letter-spacing: 1.5px;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="app-container">
    
    <div id="menu-screen" class="screen">
        <button id="zoom-btn" onclick="toggleZoom()">zoom out</button>
        
        <h1>roll<br><span>versus</span></h1>
        
        <div class="menu-panel">
            <label id="player-count-label">players: 2</label>
            <input type="range" id="playerCount" min="2" max="8" value="2" oninput="updateSlider(this.value)">
            <div id="name-inputs"></div>
        </div>

        <button class="btn" onclick="startGame()">play</button>
        <button class="btn btn-small" onclick="openUpdateLog()">update log</button>
    </div>

    <div id="update-log-screen" class="screen hidden">
        <h2 style="font-size: 2.5rem; margin-bottom: 20px; letter-spacing: 2px;">update log</h2>
        <div class="log-content">
            <span class="date">jun 5 2026</span>
            <p>• v1.0 base game</p>
        </div>
        <button class="btn" onclick="closeUpdateLog()">close</button>
    </div>

    <div id="full-leaderboard-screen" class="screen hidden">
        <h1 style="font-size: 2.5rem; margin-bottom: 0;">leaderboard</h1>
        <div id="full-leaderboard-list"></div>
        <button class="btn" onclick="closeLeaderboard()">resume game</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        </div>

    <div id="game-screen" class="screen hidden">
        <div id="game-ui">
            <div id="turn-indicator">player 1's turn</div>
            <div id="mini-leaderboard" onclick="openLeaderboard()">
                <span class="title">top 3 (click for all)</span>
                <div id="mini-lb-content"></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div class="watermark">made by vewerty ploik</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    const TARGET_SCORE = 15;
    
    let numPlayers = 2;
    let players = [];
    const playerColors = ['#00e5ff', '#ff0055', '#00ff88', '#ffea00', '#b200ff', '#ff6600', '#0088ff', '#ff00aa'];
    let turnIndex = 0;

    let gameState = 'menu';
    let previousGameState = '';
    let ball = null;
    let animationId = null;
    
    let arrowAngle = Math.PI / 2;
    let arrowDir = 1;
    let arrowSpeed = 0.03;
    
    let slots = [];
    let barriers = [];
    let currentBounces = 0;

    window.onload = () => updateNameInputs(2);

    function toggleZoom() {
        const app = document.getElementById('app-container');
        const btn = document.getElementById('zoom-btn');
        app.classList.toggle('zoomed');
        
        if (app.classList.contains('zoomed')) {
            btn.innerText = 'zoom in';
        } else {
            btn.innerText = 'zoom out';
        }
    }

    function openUpdateLog() {
        document.getElementById('update-log-screen').classList.remove('hidden');
    }

    function closeUpdateLog() {
        document.getElementById('update-log-screen').classList.add('hidden');
    }

    function updateSlider(val) {
        numPlayers = parseInt(val);
        document.getElementById('player-count-label').innerText = `players: ${numPlayers}`;
        updateNameInputs(numPlayers);
    }

    function updateNameInputs(count) {
        const container = document.getElementById('name-inputs');
        const currentInputs = container.querySelectorAll('input');
        const savedNames = Array.from(currentInputs).map(inp => inp.value);

        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const row = document.createElement('div');
            row.className = 'name-input-row';
            
            const dot = document.createElement('div');
            dot.className = 'name-indicator';
            dot.style.backgroundColor = playerColors[i];

            const inp = document.createElement('input');
            inp.type = 'text';
            inp.maxLength = 8;
            inp.placeholder = `player ${i+1}`;
            inp.id = `name-input-${i}`;
            if (savedNames[i]) inp.value = savedNames[i];

            row.appendChild(dot);
            row.appendChild(inp);
            container.appendChild(row);
        }
    }

    function resize() {
        if (gameState !== 'aiming' && gameState !== 'rolling' && gameState !== 'leaderboard') return;
        const container = document.getElementById('game-screen');
        const ui = document.getElementById('game-ui');
        width = container.clientWidth;
        height = container.clientHeight - ui.offsetHeight;
        canvas.width = width;
        canvas.height = height;
        initBoard();
    }

    window.addEventListener('resize', resize);

    function initBoard() {
        slots = [];
        barriers = [];
        
        const weights = [1.0, 0.9, 0.7, 1.5, 0.7, 0.9, 1.0]; 
        const totalWeight = weights.reduce((a, b) => a + b, 0);
        
        const slotValues = [0, 1, 2, 0, 2, 1, 0];
        const slotColors = ['#aaaaaa', '#00ff88', '#00e5ff', '#ff0055', '#00e5ff', '#00ff88', '#aaaaaa'];
        const slotLabels = ['+0', '+1', '+2', 'reset', '+2', '+1', '+0'];

        const slotHeight = 60;
        const bottomMargin = 20;
        const slotY = height - slotHeight - bottomMargin;

        let currentX = 0;
        for (let i = 0; i < 7; i++) {
            let sWidth = (weights[i] / totalWeight) * width;
            slots.push({
                x: currentX, y: slotY, width: sWidth, height: slotHeight,
                value: slotValues[i], color: slotColors[i], label: slotLabels[i]
            });
            currentX += sWidth;
        }

        const barrierWidth = 6;
        const barrierHeight = 110; 
        currentX = 0;
        for (let i = 0; i < 6; i++) {
            currentX += slots[i].width;
            barriers.push({
                x: currentX - barrierWidth / 2, y: slotY + slotHeight - barrierHeight,
                w: barrierWidth, h: barrierHeight
            });
        }
    }

    function initPlayers() {
        players = [];
        for (let i = 0; i < numPlayers; i++) {
            const nameInp = document.getElementById(`name-input-${i}`).value.trim();
            const playerName = nameInp !== '' ? nameInp : `p${i+1}`;
            players.push({
                id: i + 1,
                name: playerName,
                color: playerColors[i],
                score: 0,
                resetsHit: 0,
                rawPoints: 0,
                maxDeficit: 0,
                maxBounces: 0,
                turnsTaken: 0
            });
        }
        turnIndex = 0;
    }

    function getSortedPlayers() {
        return [...players].sort((a, b) => b.score - a.score);
    }

    function resetBall() {
        ball = {
            x: width / 2, y: 40, vx: 0, vy: 0, radius: 12,
            color: players[turnIndex].color
        };
        arrowAngle = Math.PI / 2;
        currentBounces = 0;
        gameState = 'aiming';
    }

    function switchScreen(screenId) {
        const screens = ['menu-screen', 'game-over-screen', 'full-leaderboard-screen', 'game-screen', 'update-log-screen'];
        screens.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function startGame() {
        switchScreen('game-screen');
        initPlayers();
        gameState = 'aiming';
        resize();
        updateUI();
        resetBall();
        if(animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(update);
    }

    function showMenu() {
        if(animationId) cancelAnimationFrame(animationId);
        switchScreen('menu-screen');
    }

    function openLeaderboard() {
        previousGameState = gameState;
        gameState = 'leaderboard';
        document.getElementById('full-leaderboard-screen').classList.remove('hidden');
        
        const list = document.getElementById('full-leaderboard-list');
        list.innerHTML = '';
        const sorted = getSortedPlayers();
        
        sorted.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'lb-entry';
            div.style.color = p.color;
            div.style.borderColor = p.color;
            div.innerText = `${i + 1}. ${p.name} - ${p.score} pts`;
            list.appendChild(div);
        });
    }

    function closeLeaderboard() {
        document.getElementById('full-leaderboard-screen').classList.add('hidden');
        gameState = previousGameState;
    }

    function updateUI() {
        const turnInd = document.getElementById('turn-indicator');
        const p = players[turnIndex];
        turnInd.innerText = `${p.name}'s turn`;
        turnInd.style.color = p.color;
        turnInd.style.textShadow = `0 0 10px ${p.color}88`;

        const miniLb = document.getElementById('mini-lb-content');
        miniLb.innerHTML = '';
        const sorted = getSortedPlayers();
        const displayCount = Math.min(3, sorted.length);
        
        for(let i = 0; i < displayCount; i++) {
            const sp = sorted[i];
            miniLb.innerHTML += `<div style="color: ${sp.color};">${i+1}. ${sp.name} (${sp.score})</div>`;
        }
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (gameState === 'aiming') {
            const speed = 10;
            ball.vx = Math.cos(arrowAngle) * speed;
            ball.vy = Math.sin(arrowAngle) * speed;
            gameState = 'rolling';
            players[turnIndex].turnsTaken++;
        }
    });

    function applyScore(slot) {
        let p = players[turnIndex];
        
        if (currentBounces > p.maxBounces) {
            p.maxBounces = currentBounces;
        }

        const currentMax = Math.max(...players.map(pl => pl.score));
        let deficit = currentMax - p.score;
        if (deficit > p.maxDeficit) p.maxDeficit = deficit;

        if (slot.label === 'reset') {
            p.score = 0;
            p.resetsHit++;
        } else {
            p.score += slot.value;
            p.rawPoints += slot.value;
        }
        
        if (p.score >= TARGET_SCORE) {
            endGame(p);
        } else {
            turnIndex = (turnIndex + 1) % numPlayers;
            updateUI();
            resetBall();
        }
    }

    const icons = {
        gold: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fff8cc" />
                        <stop offset="30%" stop-color="#ffd700" />
                        <stop offset="70%" stop-color="#d4af37" />
                        <stop offset="100%" stop-color="#8a6e1c" />
                    </linearGradient>
                    <linearGradient id="goldBase" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#aa8511" />
                        <stop offset="100%" stop-color="#ffe65c" />
                    </linearGradient>
                </defs>
                <path d="M15 20c0 30 20 40 35 45c15-5 35-15 35-45z" fill="url(#goldGlow)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.5"/>
                <path d="M35 20h30v5H35z" fill="#fff8cc" opacity="0.8"/>
                <rect x="42" y="65" width="16" height="20" fill="url(#goldGlow)"/>
                <path d="M30 85h40v10H30z" fill="url(#goldBase)" stroke="#fff" stroke-width="1" stroke-opacity="0.3"/>
            </svg>`,
        silver: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="silvGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="40%" stop-color="#e0e0e0" />
                        <stop offset="70%" stop-color="#a0a0a0" />
                        <stop offset="100%" stop-color="#555555" />
                    </linearGradient>
                </defs>
                <path d="M20 25c0 25 15 35 30 40c15-5 30-15 30-40z" fill="url(#silvGlow)" stroke="#fff" stroke-width="2"/>
                <rect x="42" y="65" width="16" height="15" fill="url(#silvGlow)"/>
                <path d="M30 80h40v10H30z" fill="url(#silvGlow)" stroke="#444" stroke-width="1"/>
            </svg>`,
        bronze: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="brzGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffccaa" />
                        <stop offset="40%" stop-color="#cd7f32" />
                        <stop offset="80%" stop-color="#8b5a2b" />
                        <stop offset="100%" stop-color="#4a3017" />
                    </linearGradient>
                </defs>
                <path d="M25 30c0 20 15 25 25 30c10-5 25-10 25-30z" fill="url(#brzGlow)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.6"/>
                <rect x="44" y="60" width="12" height="15" fill="url(#brzGlow)"/>
                <path d="M35 75h30v10H35z" fill="url(#brzGlow)"/>
            </svg>`,
        sell: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff6699" />
                        <stop offset="50%" stop-color="#ff0055" />
                        <stop offset="100%" stop-color="#880022" />
                    </linearGradient>
                </defs>
                <polyline points="20,10 40,45 60,25 85,75" fill="none" stroke="url(#redGlow)" stroke-width="12" stroke-linejoin="miter" stroke-linecap="round"/>
                <polygon points="85,85 65,70 95,65" fill="url(#redGlow)"/>
            </svg>`,
        comeback: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="greenGlow" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#006633" />
                        <stop offset="50%" stop-color="#00ff88" />
                        <stop offset="100%" stop-color="#ccffcc" />
                    </linearGradient>
                </defs>
                <path d="M10 85 Q 40 85, 60 45 T 85 15" fill="none" stroke="url(#greenGlow)" stroke-width="10" stroke-linecap="round"/>
                <polygon points="85,15 65,10 90,35" fill="url(#greenGlow)"/>
                <circle cx="20" cy="75" r="5" fill="#00ff88"/>
                <circle cx="35" cy="65" r="3" fill="#00ff88"/>
            </svg>`,
        least: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <radialGradient id="sadOrb" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="40%" stop-color="#aaaaaa"/>
                        <stop offset="100%" stop-color="#333333"/>
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="35" fill="url(#sadOrb)" stroke="#fff" stroke-width="2" stroke-opacity="0.3"/>
                <path d="M40 30l10 15l-5 10l15 15" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
            </svg>`,
        mostRaw: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="diamondTop" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#e6ffff" />
                        <stop offset="100%" stop-color="#00e5ff" />
                    </linearGradient>
                    <linearGradient id="diamondBot" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#00e5ff" />
                        <stop offset="100%" stop-color="#005566" />
                    </linearGradient>
                </defs>
                <polygon points="50,15 75,35 25,35" fill="url(#diamondTop)" stroke="#fff" stroke-width="1" stroke-opacity="0.8"/>
                <polygon points="25,35 75,35 50,85" fill="url(#diamondBot)" stroke="#fff" stroke-width="1" stroke-opacity="0.5"/>
                <line x1="50" y1="15" x2="50" y2="85" stroke="#fff" stroke-width="1.5" stroke-opacity="0.4"/>
            </svg>`,
        average: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="scaleGold" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffcc" />
                        <stop offset="50%" stop-color="#ffea00" />
                        <stop offset="100%" stop-color="#998800" />
                    </linearGradient>
                </defs>
                <path d="M50 85v-50M20 50l30-15l30 15v10H20z" stroke="url(#scaleGold)" stroke-width="4" fill="none"/>
                <circle cx="20" cy="65" r="12" fill="url(#scaleGold)" opacity="0.8"/>
                <circle cx="80" cy="65" r="12" fill="url(#scaleGold)" opacity="0.8"/>
                <path d="M35 85h30v8H35z" fill="url(#scaleGold)"/>
            </svg>`,
        bounces: `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e699ff" />
                        <stop offset="50%" stop-color="#b200ff" />
                        <stop offset="100%" stop-color="#4a0080" />
                    </linearGradient>
                </defs>
                <path d="M10 80 Q 20 10, 35 70 T 65 20 T 90 60" fill="none" stroke="url(#neonPurple)" stroke-width="8" stroke-linecap="round"/>
                <circle cx="90" cy="60" r="12" fill="url(#neonPurple)" stroke="#fff" stroke-width="2"/>
                <circle cx="90" cy="60" r="4" fill="#fff"/>
            </svg>`
    };

    function generateAwardSlide(title, player, desc, iconSvg, titleColor) {
        return `
            <div class="award-card">
                <div class="award-title" style="color: ${titleColor}; text-shadow: 0 0 25px ${titleColor}88;">${title}</div>
                <div class="award-icon" style="filter: drop-shadow(0 0 35px ${titleColor}AA);">${iconSvg}</div>
                <div class="award-winner" style="text-shadow: 0 0 20px ${player.color}; color: ${player.color};">${player.name}</div>
                ${desc ? `<div class="award-desc">${desc}</div>` : ''}
                <div class="scroll-prompt">scroll for more ↓</div>
            </div>
        `;
    }

    function endGame(winner) {
        gameState = 'gameover';
        
        const container = document.getElementById('game-over-screen');
        container.innerHTML = '';
        container.scrollTop = 0;
        
        const sorted = getSortedPlayers();

        // 1st, 2nd, 3rd
        container.innerHTML += generateAwardSlide('1st place', sorted[0], '', icons.gold, 'var(--gold)');
        if (sorted.length > 1) {
            container.innerHTML += generateAwardSlide('2nd place', sorted[1], '', icons.silver, 'var(--silver)');
        }
        if (sorted.length > 2) {
            container.innerHTML += generateAwardSlide('3rd place', sorted[2], '', icons.bronze, 'var(--bronze)');
        }

        // Biggest Sell
        const maxResets = Math.max(...players.map(p => p.resetsHit));
        if (maxResets > 0) {
            const seller = players.find(p => p.resetsHit === maxResets);
            container.innerHTML += generateAwardSlide('biggest sell', seller, `${seller.name} hit the reset box ${maxResets} times.`, icons.sell, '#ff0055');
        }

        // Greatest Comeback
        const winnerDeficit = sorted[0].maxDeficit;
        if (winnerDeficit > 0) {
            container.innerHTML += generateAwardSlide('greatest comeback', sorted[0], `${sorted[0].name} won after trailing by ${winnerDeficit} points.`, icons.comeback, '#00ff88');
        }

        // Least Points
        const leastPlayer = sorted[sorted.length - 1];
        container.innerHTML += generateAwardSlide('least points', leastPlayer, `${leastPlayer.name} finished with only ${leastPlayer.score} points.`, icons.least, '#aaaaaa');

        // Most Raw Points
        const mostRawScore = Math.max(...players.map(p => p.rawPoints));
        const rawPlayer = players.find(p => p.rawPoints === mostRawScore);
        container.innerHTML += generateAwardSlide('most raw points', rawPlayer, `${rawPlayer.name} scored ${mostRawScore} total points before resets.`, icons.mostRaw, '#00e5ff');

        // Most Bounces
        const topBounces = Math.max(...players.map(p => p.maxBounces));
        if (topBounces > 0) {
            const bouncePlayer = players.find(p => p.maxBounces === topBounces);
            container.innerHTML += generateAwardSlide('most bounces', bouncePlayer, `${bouncePlayer.name} hit ${topBounces} bounces in a single majestic shot.`, icons.bounces, '#b200ff');
        }

        // Most Average
        const totalGameScore = players.reduce((sum, p) => sum + p.score, 0);
        const avgScore = totalGameScore / numPlayers;
        const avgPlayer = players.reduce((prev, curr) => Math.abs(curr.score - avgScore) < Math.abs(prev.score - avgScore) ? curr : prev);
        container.innerHTML += generateAwardSlide('most average', avgPlayer, `${avgPlayer.name}'s score of ${avgPlayer.score} was incredibly close to the game's average of ${avgScore.toFixed(1)}.`, icons.average, '#ffea00');

        container.innerHTML += `
            <div class="action-slide">
                <h2 style="font-size: 3rem; margin-bottom: 30px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 20px #fff;">game over</h2>
                <button class="btn" onclick="startGame()">play again</button>
                <button class="btn" onclick="showMenu()">main menu</button>
            </div>
        `;

        switchScreen('game-over-screen');
    }

    function handleBarrierCollision(ball, rect) {
        let testX = ball.x;
        let testY = ball.y;

        if (ball.x < rect.x) testX = rect.x;
        else if (ball.x > rect.x + rect.w) testX = rect.x + rect.w;

        if (ball.y < rect.y) testY = rect.y;
        else if (ball.y > rect.y + rect.h) testY = rect.y + rect.h;

        let distX = ball.x - testX;
        let distY = ball.y - testY;
        let distance = Math.sqrt((distX*distX) + (distY*distY));

        if (distance <= ball.radius) {
            let overlap = ball.radius - distance;
            let nx = distX / distance;
            let ny = distY / distance;

            ball.x += nx * overlap;
            ball.y += ny * overlap;

            let dotProduct = (ball.vx * nx) + (ball.vy * ny);
            let restitution = 0.85; 
            ball.vx -= (1 + restitution) * dotProduct * nx;
            ball.vy -= (1 + restitution) * dotProduct * ny;

            currentBounces++; 
        }
    }

    function update() {
        if (gameState === 'leaderboard') {
            requestAnimationFrame(update);
            return;
        }
        if (gameState !== 'aiming' && gameState !== 'rolling') return;

        if (gameState === 'aiming') {
            arrowAngle += arrowSpeed * arrowDir;
            if (arrowAngle > 4 * Math.PI / 5 || arrowAngle < Math.PI / 5) {
                arrowDir *= -1;
            }
        }

        if (gameState === 'rolling' && ball) {
            ball.vy += 0.1; 
            ball.vx *= 0.995;
            ball.vy *= 0.995;

            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -0.9;
                currentBounces++;
            } else if (ball.x + ball.radius > width) {
                ball.x = width - ball.radius;
                ball.vx *= -0.9;
                currentBounces++;
            }

            for (let barrier of barriers) {
                handleBarrierCollision(ball, barrier);
            }

            const bottomMargin = 20;
            if (ball.y > height - bottomMargin + ball.radius) {
                let scored = false;
                for (let slot of slots) {
                    if (ball.x >= slot.x && ball.x <= slot.x + slot.width) {
                        applyScore(slot);
                        scored = true;
                        break;
                    }
                }
                if (!scored) applyScore(slots[slots.length-1]); 
            }
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        for (let slot of slots) {
            ctx.fillStyle = '#111';
            ctx.fillRect(slot.x, slot.y, slot.width, slot.height);
            
            ctx.beginPath();
            ctx.moveTo(slot.x, slot.y);
            ctx.lineTo(slot.x + slot.width, slot.y);
            ctx.strokeStyle = slot.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = slot.color;
            ctx.stroke();
            ctx.shadowBlur = 0; 
            
            ctx.fillStyle = slot.color;
            ctx.font = '500 16px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(slot.label, slot.x + slot.width / 2, slot.y + slot.height / 2);
        }

        ctx.fillStyle = '#333';
        for (let b of barriers) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#666';
            ctx.beginPath();
            ctx.arc(b.x + b.w/2, b.y, b.w/2, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#333';
        }

        if (ball) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = ball.color;
            ctx.fillStyle = ball.color;
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; 

            if (gameState === 'aiming') {
                const arrowLength = 40;
                ctx.save();
                ctx.translate(ball.x, ball.y);
                ctx.rotate(arrowAngle);
                
                ctx.strokeStyle = ball.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ball.radius + 8, 0);
                ctx.lineTo(ball.radius + arrowLength, 0);
                ctx.stroke();

                ctx.fillStyle = ball.color;
                ctx.beginPath();
                ctx.moveTo(ball.radius + arrowLength + 6, 0);
                ctx.lineTo(ball.radius + arrowLength, 5);
                ctx.lineTo(ball.radius + arrowLength, -5);
                ctx.fill();
                
                ctx.restore();
            }
        }
    }
</script>
